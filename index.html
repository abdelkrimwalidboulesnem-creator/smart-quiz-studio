<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Quiz Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <div class="lang-selector">
            <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
            <button class="lang-btn" onclick="changeLanguage('fr')">FR</button>
            <button class="lang-btn" onclick="changeLanguage('ar')">AR</button>
        </div>

        <div id="category-container">
            <h1 id="ui-choose-cat">Choose Quiz Category</h1>
            <div class="category-grid">
                <button class="cat-btn" data-category="informatique">💻 Informatique</button>
                <button class="cat-btn" data-category="sport">⚽ Sport</button>
                <button class="cat-btn" data-category="general">🌍 General Knowledge</button>
                <button class="cat-btn" data-category="science">🔬 Science</button>
                <button class="cat-btn" data-category="cinema">🎬 Cinema & Movies</button>
                <button class="cat-btn" data-category="history">📜 History</button>
            </div>
        </div>

        <header class="quiz-header hide" id="quiz-header">
            <h1 id="category-title">Quiz</h1>
            <div id="stats" class="stats">
                <span id="question-counter">Question: 1/3</span>
                <span id="score-container">Score: <span id="score">0</span></span>
            </div>
        </header>

        <main id="quiz-body">
            <div id="question-container" class="hide">
                <h2 id="question">Loading question...</h2>
                <div id="answer-buttons" class="btn-grid">
                    <button class="btn">Option 1</button>
                    <button class="btn">Option 2</button>
                    <button class="btn">Option 3</button>
                    <button class="btn">Option 4</button>
                </div>
            </div>

            <div id="result-container" class="hide">
                <h2 id="ui-completed">Quiz Completed! 🎉</h2>
                <p id="final-score">Your final score is 0</p>
                <button id="restart-btn" class="btn restart-btn">Choose Another Category</button>
            </div>
        </main>

        <footer class="quiz-footer">
            <button id="next-btn" class="next-btn hide">Next Question</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
